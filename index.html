/* Layered envelope opening */
html{overscroll-behavior-y:none;overflow-x:clip}

body.locked{height:100svh;height:100dvh;overflow:hidden;overscroll-behavior:none}

#cover{overflow:hidden;isolation:isolate;transition:opacity .8s 2.65s,visibility 0s 3.5s;background:radial-gradient(ellipse at 50% 43%,#743145 0%,#3a1020 58%,#200912 100%)}

.letter-flourish{font-size:48px}.letter-monogram{font:italic 54px 'Cormorant Garamond',serif;letter-spacing:5px}.letter-monogram i{font-size:25px;color:#bd985b}.letter-date{font:12px 'Cormorant Garamond',serif;letter-spacing:4px}.letter-rule{width:65px;height:1px;background:#bb925777}

        cell.textContent = name;
      }
      return row;
    });
    document.querySelector(selector).replaceChildren(...rows);
  }

  for (const [selector, names] of [['#family-young', family.young], ['#family-maternal-young', family.maternalYoung]]) {

      const item = document.createElement('li');
      item.textContent = name;
      return item;
    });
    document.querySelector(selector).replaceChildren(...items);
  }
}

function revealWeddingDate(moveFocus = false) {

  }).finished.then(finish, finish);
}
function paintFoil() {
  if (foil.hidden) return;
  const width = foil.clientWidth;
  const height = foil.clientHeight;
  if (!width || !height || (foilPainted && foil.width === width && foil.height === height)) return;
  const previous = foilPainted ? document.createElement('canvas') : null;
  if (previous) {
    previous.width = foil.width;
    previous.height = foil.height;
    previous.getContext('2d').drawImage(foil, 0, 0);
  }
  foilPainted = true;
  foil.width = width;
  foil.height = height;
  if (previous) {
    brush.drawImage(previous, 0, 0, width, height);
    return;
  }
  const sunset = brush.createLinearGradient(0, 0, width, height);
  sunset.addColorStop(0, '#d7a185');
  sunset.addColorStop(.38, '#cb927a');
  sunset.addColorStop(.72, '#bc8177');
  sunset.addColorStop(1, '#a66b65');
  brush.fillStyle = sunset;
  brush.fillRect(0, 0, width, height);
  brush.fillStyle = '#fffaf266';
  for (let y = 4; y < height; y += 7) {
    for (let x = 5 + (y % 11); x < width; x += 11) brush.fillRect(x, y, 1, 1);
  }
}
function eraseStroke(point, width, opacity) {
  brush.globalAlpha = opacity;
  brush.lineWidth = width;
  brush.beginPath();
  if (lastPoint) {
    brush.moveTo(...lastPoint);
    brush.lineTo(...point);
    brush.stroke();
  } else {
    brush.arc(...point, width / 2, 0, Math.PI * 2);
    brush.fill();
  }
}
function scratchAt(event, rect) {
  const point = [event.clientX - rect.left, event.clientY - rect.top];
  const width = Math.max(23, foil.width * .089);
  brush.globalCompositeOperation = 'destination-out';
  brush.lineCap = 'round';
  eraseStroke(point, width + 6, .24);
  eraseStroke(point, width, 1);
  lastPoint = point;
  brush.globalAlpha = 1;
  brush.globalCompositeOperation = 'source-over';
}
function endScratch(event) {
  if (event.pointerId !== scratchPointer) return;
  scratchPointer = null;
  lastPoint = null;
  const pixels = brush.getImageData(0, 0, foil.width, foil.height).data;
  let cleared = 0;
  for (let i = 3; i < pixels.length; i += 40) if (pixels[i] === 0) cleared++;
  if (cleared / Math.ceil(pixels.length / 40) >= .38) revealWeddingDate();
}
revealButton.onclick = () => revealWeddingDate(true);
if (brush) {
  new ResizeObserver(paintFoil).observe(foil);
  paintFoil();
  foil.addEventListener('pointerdown', event => {
    if (event.button !== 0 || scratchPointer !== null) return;
    scratchPointer = event.pointerId;
    foil.setPointerCapture(scratchPointer);
    scratch.classList.add('is-scratching');
    scratchAt(event, foil.getBoundingClientRect());
  });
  foil.addEventListener('pointermove', event => {
    if (event.pointerId !== scratchPointer) return;
    const rect = foil.getBoundingClientRect();
    const points = event.getCoalescedEvents?.();
    for (const point of points?.length ? points : [event]) scratchAt(point, rect);
  });
  foil.addEventListener('lostpointercapture', endScratch);
} else {
  revealWeddingDate();
}

const dayList = document.querySelector('#days');
const processionCar = document.querySelector('.procession-car');
let processionFrame = 0;

function updateProcession() {
 processionFrame = 0;
 const rows = dayList.querySelectorAll('.procession-row');
 const car = processionCar.getBoundingClientRect();
 const carCenter = car.top + car.height / 2;
 let current = null;
 if (car.height && carCenter > 0 && carCenter < window.innerHeight) {
   for (const row of rows) {
     const box = row.getBoundingClientRect();
     const distance = Math.abs(box.top + box.height / 2 - carCenter);
     if (distance <= Math.min(78, box.height * .36)) {
       current = row;
       break;
     }
   }
 }
 rows.forEach((row, index) => {
   row.classList.toggle('is-current', row === current);
   if (row === current) {
     unrolledEvents.add(index);
     row.classList.add('is-unrolled');
   }
 });
}
function queueProcession() {
 if (!processionFrame) processionFrame = requestAnimationFrame(updateProcession);
}
window.addEventListener('scroll', queueProcession, {passive:true});
window.addEventListener('resize', queueProcession);
new ResizeObserver(queueProcession).observe(dayList);
new MutationObserver(queueProcession).observe(dayList, {childList:true});
queueProcession();
